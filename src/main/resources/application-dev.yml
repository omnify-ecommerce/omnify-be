spring:
  flyway:
    # Dev only: also runs sample seed data (db/seed) after schema migrations.
    # NEVER include db/seed in the prod profile.
    locations: classpath:db/migration,classpath:db/seed

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.omnify: DEBUG

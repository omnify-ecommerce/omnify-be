spring:
  application:
    name: omnify

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

omnify:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: 900
    token:
      password-reset:
        bytes: 32
        expiration: 15m
    otp:
      length: 6
      expiration: 5m
      resend-cooldown: 60s
      max-attempts: 5
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:12}

    auth:
      refresh-token-ttl-days: 30d
      lockout:
        schedule-seconds: [0,0,0,30,60,120,300,600]
    rate-limit:
      rules:
        login:
          path: /api/v1/auth/login
          capacity: 5
          refresh-period-seconds: 60
        register:
          path: /api/v1/auth/register
          capacity: 3
          refresh-period-seconds: 60
        resend-verification:
          path: /api/v1/auth/resend-verification
          capacity: 3
          refresh-period-seconds: 60
        refresh:
          path: /api/v1/auth/refresh
          capacity: 10
          refresh-period-seconds: 60
        verify-email:
          path: /api/v1/auth/verify-email
          capacity: 5
          refresh-period-seconds: 60
        verify-phone:
          path: /api/v1/auth/verify-phone
          capacity: 5
          refresh-period-seconds: 60
        resend-verification-phone:
          path: /api/v1/auth/resend-verification-phone
          capacity: 3
          refresh-period-seconds: 60
  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name: ${MAIL_FROM_NAME:Omnify}
  captcha:
    recaptcha:
      secret-key: ${RECAPTCHA_SECRET_KEY}
      verify-url: https://www.google.com/recaptcha/api/siteverify
      score-threshold: 0.5
  verification:
    email-token-ttl-minutes: 30m
    phone-token-ttl-minutes: 5m
    resend-cooldown-seconds: 60
    max-otp-attempts: 5
    duplicate-registration-alert-cooldown-seconds: 86400   # 24 giờ
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

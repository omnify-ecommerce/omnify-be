spring:
  application:
    name: omnify

  profiles:
    active: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

omnify:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: 900
    auth:
      refresh-token-ttl-days: 30
      lockout:
        schedule-seconds: [0,0,0,30,60,120,300,600]
    rate-limit:
      rules:
        login:
          path: /api/v1/auth/login
          capacity: 5
          refresh-period-seconds: 60
        register:
          path: /api/v1/auth/register
          capacity: 3
          refresh-period-seconds: 60
        resend-verification:
          path: /api/v1/auth/resend-verification
          capacity: 3
          refresh-period-seconds: 60
        refresh:
          path: /api/v1/auth/refresh
          capacity: 10
          refresh-period-seconds: 60
        verify-email:
          path: /api/v1/auth/verify-email
          capacity: 5
          refresh-period-seconds: 60
  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name: ${MAIL_FROM_NAME:Omnify}
  verification:
    email-token-ttl-minutes: 30
    phone-token-ttl-minutes: 5
    resend-cooldown-seconds: 60
    max-otp-attempts: 5
    duplicate-registration-alert-cooldown-seconds: 86400   # 24 giờ
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
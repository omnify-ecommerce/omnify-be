spring:
  flyway:
    locations: classpath:db/migration   # schema only — no sample data in prod

  data:
    redis:
      password: ${REDIS_PASSWORD}   # BẮT BUỘC set qua env var ở prod; Redis không nên chạy không password ngoài môi trường dev

  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.omnify: INFO
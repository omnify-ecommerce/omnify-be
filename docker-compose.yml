version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnify-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnify}
      POSTGRES_USER: ${POSTGRES_USER:-omnify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnify}
    ports:
      - "5432:5432"
    volumes:
      - omnify_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: omnify-redis
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: omnify-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  omnify_pg_data:
